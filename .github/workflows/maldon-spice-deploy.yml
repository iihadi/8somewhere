# Builds the Maldon Spice site (maldon-spice/) and uploads it to IONOS webspace over SFTP.
#
# - Every push to main that touches maldon-spice/ deploys a PREVIEW build (draft banner, noindex)
#   to IONOS_PREVIEW_DIR, for example the folder behind preview.maldonspice.co.uk.
# - PRODUCTION is manual only: Actions > "Maldon Spice deploy" > Run workflow > target: production.
#   It refuses to build while any menu item is unreviewed.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   IONOS_SFTP_HOST      e.g. access-5012345678.webspace-host.com (IONOS > Hosting > SFTP & SSH)
#   IONOS_SFTP_USER      the SFTP user name
#   IONOS_SFTP_PASSWORD  the SFTP password
#   IONOS_PREVIEW_DIR    e.g. /maldonspice-preview
#   IONOS_PROD_DIR       e.g. /maldonspice-site   (the folder the domain points at in IONOS)

name: Maldon Spice deploy

on:
  push:
    branches: [main]
    paths: ['maldon-spice/**', '.github/workflows/maldon-spice-deploy.yml']
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: maldon-spice-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maldon-spice
    env:
      TARGET: ${{ github.event.inputs.target || 'preview' }}
      HAS_SECRETS: ${{ secrets.IONOS_SFTP_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maldon-spice/package-lock.json

      - run: npm ci

      - name: Build (preview)
        if: env.TARGET == 'preview'
        run: npm run build:preview

      - name: Build (production)
        if: env.TARGET == 'production'
        run: npm run build

      - name: Upload to IONOS
        if: env.HAS_SECRETS == 'true'
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DIR: ${{ env.TARGET == 'production' && secrets.IONOS_PROD_DIR || secrets.IONOS_PREVIEW_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; mirror --reverse --delete --verbose dist/ $DIR/; bye"

      - name: Secrets missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Built OK. Add the IONOS_* secrets to upload automatically (see the workflow header)."
